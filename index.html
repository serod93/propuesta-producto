<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Propuesta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root { --papel-100: #f5eee3; --papel-200: #fffaf2; --tinta: #141210; --tinta-suave: #5f574e; --linea-suave: #d8cdbd; --error: #b42f17; }
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--papel-100); color: var(--tinta); font-family: "Google Sans", system-ui, -apple-system, "Segoe UI", sans-serif; display: grid; place-items: center; padding: 16px; }
form { width: 100%; max-width: 380px; background: var(--papel-200); border: 1px solid var(--linea-suave); border-radius: 28px; padding: 32px 28px; }
.puntos { display: flex; gap: 8px; margin-bottom: 24px; }
.puntos span { width: 14px; height: 14px; border-radius: 50%; border: 1.5px solid var(--tinta); }
h1 { font-size: 24px; line-height: 1.2; margin: 0 0 8px; }
p { margin: 0 0 24px; color: var(--tinta-suave); font-size: 15px; line-height: 1.45; }
label { display: block; font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--tinta-suave); margin-bottom: 8px; }
input { width: 100%; font: inherit; font-size: 17px; padding: 12px 14px; border: 1.5px solid var(--tinta); border-radius: 10px; background: var(--papel-100); color: var(--tinta); }
button { margin-top: 16px; width: 100%; font: inherit; font-size: 16px; font-weight: 500; padding: 12px; border-radius: 10px; border: 1px solid var(--tinta); background: var(--tinta); color: var(--papel-100); cursor: pointer; }
button:disabled { opacity: 0.6; cursor: progress; }
.error { color: var(--error); font-size: 14px; margin: 12px 0 0; min-height: 20px; }
:focus-visible { outline: 3px solid var(--tinta); outline-offset: 3px; }
</style>
</head>
<body>
<form id="f">
  <div class="puntos" aria-hidden="true"><span style="background:#8fb3ff"></span><span style="background:#9fe2bf"></span><span style="background:#ffc857"></span><span style="background:#ff8f7a"></span></div>
  <h1>Esta página está protegida</h1>
  <p>Ingresa la contraseña que te enviaron para verla.</p>
  <label for="clave">Contraseña</label>
  <input id="clave" type="password" autocomplete="current-password" required autofocus>
  <button id="b" type="submit">Entrar</button>
  <div class="error" id="e" role="alert"></div>
</form>
